server {
  listen 8082;
  server_name 192.168.1.1;

  root /opt/routerd/static;
  index index.html;

  # Job files and previews are streamed from nodes: no buffering on the router's disk,
  # long timeouts for multi-GB transfers, Range headers pass through.
  location ~ ^/api/ui/jobs/[^/]+/(file|preview)$ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # yt-dlp page scan: the node runs yt-dlp before answering (up to 2 minutes on big playlists).
  location = /api/ui/media/extract {
    proxy_pass http://127.0.0.1:18080;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
